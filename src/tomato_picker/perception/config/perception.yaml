cloud_preprocessor:
  ros__parameters:
    topics:
      color_image: /camera/wrist/color/image_raw
      depth_image: /camera/wrist/depth/image_raw
      depth_info: /camera/wrist/depth/camera_info
      cloud_raw: /tomato_picker/perception/cloud/raw
      cloud_base: /tomato_picker/perception/cloud/base
      cloud_filtered: /tomato_picker/perception/cloud/filtered
      clear_octomap_service: /clear_octomap
      scene_service: /tomato_picker/perception/set_scene_enabled

    target_frame: base_link
    pixel_stride: 4
    frame_skip: 1

    min_depth: 0.15
    max_depth: 1.50

    workspace:
      min_x: 0.00
      max_x: 0.80
      min_y: -0.50
      max_y: 0.50
      min_z: 0.00
      max_z: 1.20

    voxel_leaf: 0.015
    sor_mean_k: 20
    sor_stddev: 1.0

    publish_raw: true
    publish_base: true
    publish_filtered: true
